[project]
name = "optledger"
version = "0.1.0"
description = "Snapshots, pin/join data quality, and option lifecycle reconciliation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Greg Weyer" }]
keywords = ["options", "ledger", "parquet", "data-quality"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=24.0.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
web = [
    "streamlit>=1.36,<2.0",
]
ref = [
    "vollib>=1.0.11,<2.0",
]
tearsheet = [
    "quantstats>=0.0.62",
]
sql = [
    "duckdb>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/Suppressor72/options-book-ledger"
Issues = "https://github.com/Suppressor72/options-book-ledger/issues"

[project.scripts]
optledger = "optledger.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optledger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PGH"]

[tool.ruff.lint.isort]
known-first-party = ["optledger"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pandas", "quantstats", "streamlit"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
