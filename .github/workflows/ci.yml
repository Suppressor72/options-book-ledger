name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev --extra web --extra ref
      - name: Ruff
        run: uv run ruff check optledger tests && uv run ruff format --check optledger tests
      - name: Mypy
        run: uv run mypy optledger
      - name: Pytest
        run: uv run pytest -q
